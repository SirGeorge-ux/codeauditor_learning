linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - nilerr
    - prealloc
    - unconvert

linters-settings:
  goimports:
    local-prefixes: github.com/anomalyco/codeauditor
  misspell:
    locale: US
    ignore-rules:
      # Spanish-domain vocabulary that is legitimate in our domain.
      # Misspell runs in US locale and would flag every Spanish
      # comment; these entries keep the linter useful for English
      # misspellings while not policing Spanish terms.
      - informacion
      - implementacion
      - socratico
      - socratica
      - cronologico
      - conversacional

issues:
  exclude-dirs:
    - vendor
  max-issues-per-linter: 0
  max-same-issues: 0
