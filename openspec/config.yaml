schema: spec-driven

context: |
  Project: CodeAuditor — interactive code audit dojo with 3 practice modes.
  Stack: Go 1.23 backend (Chi v5, hexagonal), Angular 21.2 frontend (hexagonal, Signals, Vitest).
  Architecture: Dual hexagonal (Go + Angular), strict layer separation.
  Testing: Go stdlib + Vitest 4 + Playwright E2E. Workspace `make test` covers both.
  Persistence: Supabase (PostgreSQL 15 + Auth). Sandbox: Local + Docker.
  LLM: Ollama local, OpenRouter cascade, MiniMax M3 opt-in.

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    - Run TDD cycle: test → implement → refactor
    tdd: true
    test_command: "make test"
  verify:
    test_command: "make test"
    build_command: "make build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

projects:
  - path: backend/
    stack: Go 1.23
    test_command: "make test-backend"
    lint_command: "make lint-backend"
    format_command: "make fix-backend"
    build_command: "make build-backend"
  - path: frontend/codeauditor/
    stack: Angular 21.2 + TypeScript 5.9
    test_command: "make test-frontend"
    lint_command: "make lint-frontend"
    format_command: "make fix-frontend"
    build_command: "make build-frontend"

testing:
  strict_tdd: true
  capabilities: |
    ## Testing Capabilities

    **Strict TDD Mode**: enabled
    **Detected**: 2026-09-21 (reinit)
    **Workspace-level test command**: `make test` (covers backend + frontend)

    ### Projects

    | Relative path | Stack | Test command | Framework |
    | ------------- | ----- | ------------ | --------- |
    | `backend/` | Go 1.23 | `make test-backend` | Go stdlib + testify |
    | `frontend/codeauditor/` | Angular 21.2 | `make test-frontend` | Vitest 4.0.8 + jsdom 28 |

    ### Test Layers

    | Relative path | Layer       | Available | Tool        |
    | ------------- | ----------- | --------- | ----------- |
    | `backend/` | Unit        | ✅        | go test     |
    | `backend/` | Integration | ❌        | —           |
    | `backend/` | E2E         | ❌        | —           |
    | `frontend/codeauditor/` | Unit        | ✅        | Vitest 4    |
    | `frontend/codeauditor/` | Integration | ❌        | —           |
    | `frontend/codeauditor/` | E2E         | ✅        | Playwright 1.60 |

    ### Coverage

    | Relative path | Available | Command |
    | ------------- | --------- | ------- |
    | `backend/` | ✅        | `go test -coverprofile=coverage.out ./...` |
    | `frontend/codeauditor/` | ✅        | `ng test --code-coverage` |

    ### Quality Tools

    | Relative path | Tool         | Available | Command        |
    | ------------- | ------------ | --------- | -------------- |
    | `backend/` | Linter       | ✅        | `make lint-backend` (golangci-lint) |
    | `backend/` | Type checker | ✅        | `go vet ./...` |
    | `backend/` | Formatter    | ✅        | `make fix-backend` (gofumpt) |
    | `frontend/codeauditor/` | Linter       | ✅        | `make lint-frontend` (ESLint) |
    | `frontend/codeauditor/` | Type checker | ✅        | TypeScript 5.9 (via `ng build`) |
    | `frontend/codeauditor/` | Formatter    | ✅        | `make fix-frontend` (Prettier 3.8.1) |
